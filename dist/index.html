<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>paz y tato conquistan américa</title>
  <meta name="description" content="nyc · diciembre 2026. mapa y links del viaje.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23111'/%3E%3Ctext x='32' y='43' font-size='38' font-weight='700' font-family='Helvetica,Arial' text-anchor='middle' fill='%23ff613a'%3Ep%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script defer src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
  <script defer src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <nav class="mobile-section-nav" aria-label="Secciones"><a href="#inicio">Inicio</a><a href="#mapa">Mapa</a><a href="#lugares">Lista</a></nav>
  <main>
    <section class="hero" id="inicio" aria-labelledby="trip-title">
      <h1 class="visually-hidden" id="trip-title">Pasiamor &amp; Dmowl conquistan América</h1>
      <div class="hero-board">
        <div class="hero-line hero-line--1" aria-hidden="true"><span class="hero-hover" data-cursor="PAZ" data-cursor-color="#d02700">Pasiamor</span><span>&amp;</span><span class="hero-hover" data-cursor="TATO" data-cursor-color="#2645ef">Dmowl</span></div>
        <div class="hero-line hero-line--2" aria-hidden="true"><span>Conquistan</span><span class="hero-date"><span>(</span><span>2</span><span>3</span><span>—</span><span>1</span><span>2</span><span>)</span></span></div>
        <div class="hero-line hero-line--3">
          <button class="hero-asterisk-button" type="button" aria-label="ver la cuenta regresiva al viaje" aria-haspopup="dialog"><svg class="hero-asterisk" viewBox="0 0 100 99" width="100" height="99" aria-hidden="true"><path d="M93.1387 25.2611L100 47.0177L68.9051 56.6549L89.1971 85.7124L70.5109 99L50.219 71.5487L29.3431 99L10.6569 85.7124L31.0949 56.6549L0 47.0177L6.86131 25.2611L37.3723 35.1903V0H62.6277V35.1903L93.1387 25.2611Z" fill="currentColor" fill-opacity="0.9"/></svg></button>
          <span aria-hidden="true">América</span>
        </div>
        <nav class="hero-cards" aria-label="secciones">
          <button class="hero-card hero-card--food" type="button"><span class="hero-card-hit"></span><span class="hero-card-art"><span class="hero-card-flip"><span class="hero-card-tilt"><span class="hero-card-face hero-card-front"><img src="assets/card-comida.webp" alt="" width="744" height="470" decoding="async"><img class="hero-card-label" src="assets/label-comida.png" alt="" decoding="async"><span class="hero-card-bullet" aria-hidden="true">C</span></span><span class="hero-card-face hero-card-back"><img src="assets/back-comida.webp" alt="" width="744" height="470" decoding="async"><span class="hero-card-back-name">COMIDA</span></span></span></span></span><span class="visually-hidden">comida</span></button>
          <button class="hero-card hero-card--culture" type="button"><span class="hero-card-hit"></span><span class="hero-card-art"><span class="hero-card-flip"><span class="hero-card-tilt"><span class="hero-card-face hero-card-front"><img src="assets/card-museos.webp" alt="" width="744" height="470" decoding="async"><img class="hero-card-label" src="assets/label-museos.png" alt="" decoding="async"><span class="hero-card-bullet" aria-hidden="true">M</span></span><span class="hero-card-face hero-card-back"><img src="assets/back-museos.webp" alt="" width="744" height="470" decoding="async"><span class="hero-card-back-name">MUSEOS</span></span></span></span></span><span class="visually-hidden">museos</span></button>
          <button class="hero-card hero-card--shop" type="button"><span class="hero-card-hit"></span><span class="hero-card-art"><span class="hero-card-flip"><span class="hero-card-tilt"><span class="hero-card-face hero-card-front"><img src="assets/card-shops.webp" alt="" width="744" height="470" decoding="async"><img class="hero-card-label" src="assets/label-shops.png" alt="" decoding="async"><span class="hero-card-bullet" aria-hidden="true">S</span></span><span class="hero-card-face hero-card-back"><img src="assets/back-shops.webp" alt="" width="744" height="470" decoding="async"><span class="hero-card-back-name">SHOPS</span></span></span></span></span><span class="visually-hidden">shops</span></button>
          <button class="hero-card hero-card--walk" type="button"><span class="hero-card-hit"></span><span class="hero-card-art"><span class="hero-card-flip"><span class="hero-card-tilt"><span class="hero-card-face hero-card-front"><img src="assets/card-paseo.webp" alt="" width="744" height="470" decoding="async"><img class="hero-card-label" src="assets/label-paseo.png" alt="" decoding="async"><span class="hero-card-bullet" aria-hidden="true">P</span></span><span class="hero-card-face hero-card-back"><img src="assets/back-paseo.webp" alt="" width="744" height="470" decoding="async"><span class="hero-card-back-name">PASEITO</span></span></span></span></span><span class="visually-hidden">paseos</span></button>
        </nav>
      </div>
      <button class="admin-trigger hero-admin-trigger" id="admin-trigger" type="button" aria-haspopup="dialog">admin</button>
      <span class="hero-cursor" aria-hidden="true"></span>
      <div class="countdown" id="countdown" role="dialog" aria-modal="true" aria-label="cuenta regresiva al viaje" hidden>
        <div class="countdown-bar"><button class="countdown-close" type="button">cerrar</button></div>
        <div class="countdown-stage" role="timer">
          <div class="countdown-side countdown-side--left">
            <span class="countdown-paren" aria-hidden="true">(</span>
            <span class="countdown-unit"><span class="countdown-num" data-unit="days">00</span><span class="countdown-label">días</span></span>
          </div>
          <span class="countdown-gap"></span>
          <figure class="countdown-photo"><img alt="" decoding="async"></figure>
          <span class="countdown-gap"></span>
          <div class="countdown-side countdown-side--right">
            <span class="countdown-unit"><span class="countdown-num" data-unit="hours">00</span><span class="countdown-label">horas</span></span>
            <span class="countdown-unit"><span class="countdown-num" data-unit="minutes">00</span><span class="countdown-label">minutos</span></span>
            <span class="countdown-paren" aria-hidden="true">)</span>
          </div>
        </div>
      </div>
    </section>
    <section id="mapa" aria-labelledby="map-heading">
      <div class="map-frame">
        <div class="map-sidebar">
      <h2 id="map-heading" class="map-heading">Mapa (<span id="map-count">0</span>)</h2>
          <aside class="map-legend" aria-label="categorías"><div class="layer-buttons" id="layer-buttons"></div></aside>

          <aside class="station-panel sidebar-card" aria-live="polite" hidden></aside>
          <div class="map-sidebar-footer">
            <div class="map-note text-detail" id="map-credits"></div>
          <details class="map-add admin-only" id="add-point">
            <summary class="button button--control button--solid">Agregar lugar <span class="ui-symbol" aria-hidden="true"></span></summary>
            <form id="link-form" class="map-link-form">
          <label class="visually-hidden" for="url-input">link de Google Maps</label>
          <input id="url-input" name="url" type="url" inputmode="url" autocomplete="url" placeholder="Link de Google Maps" required>
          <label class="visually-hidden" for="category-input">categoría</label>
          <span class="select-shell"><select name="category" id="category-input" aria-label="categoría"></select></span>
          <button class="button button--control button--solid" type="submit">Agregar <span class="ui-symbol" aria-hidden="true">→</span></button>
        </form>
            <p class="text-detail form-note" id="form-error" role="alert"></p>
          </details>
          </div>
        </div>
        <div class="map-viewport is-loading" aria-busy="true">
          <div class="map-loader" role="status"><span class="loader-dot" aria-hidden="true"></span>Cargando mapa</div>
          <div id="map" role="region" aria-labelledby="map-heading"><div id="map-fallback">cargando mapa…</div></div>
          <div class="map-bottom">
          <div class="map-navigation">
            <div id="map-zoom" aria-label="zoom del mapa"></div>
            <button class="button button--icon button--solid" id="reset-map" type="button" aria-label="Ver todo" title="Ver todo"><span class="ui-symbol" aria-hidden="true">↔</span></button>
          </div>
          <div class="map-overlays" aria-label="Capas del mapa">
            <button class="button button--control button--solid" id="toggle-neighborhoods" type="button" aria-pressed="false">Barrios <span class="ui-symbol" aria-hidden="true">+</span></button>
            <button class="button button--control button--solid" id="toggle-subway" type="button" aria-pressed="false">Subtes <span class="ui-symbol" aria-hidden="true">+</span></button>
          </div>
          </div>
        </div>
      </div>
      <section class="places-index" id="lugares" aria-labelledby="places-heading">
        <h2 id="places-heading" class="visually-hidden">lugares por categoría</h2>
        <div id="station-list"></div>
      </section>
      <details class="station-index" id="links">
        <summary>links <span id="link-count" class="text-detail">00</span></summary>
        <div id="link-items"><p class="empty-links">sin lugares todavía.</p></div>
      </details>
    </section>

  </main>
  <dialog class="admin-dialog" id="admin-dialog" aria-labelledby="admin-heading">
    <div class="admin-dialog-panel">
      <header class="admin-dialog-heading">
        <h2 id="admin-heading">Acceso admin</h2>
        <button class="button button--icon" id="admin-close" type="button" aria-label="Cerrar">×</button>
      </header>
      <form class="admin-login-form" id="admin-login-form">
        <label for="admin-password">Contraseña</label>
        <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
        <button class="button button--control button--solid" type="submit">Entrar <span class="ui-symbol" aria-hidden="true">→</span></button>
        <p class="text-detail form-note" id="admin-error" role="alert"></p>
      </form>
    </div>
  </dialog>
  <div class="toast text-detail" id="toast" role="status" hidden></div>
</body>
</html>
